<style>
:root{color-scheme:dark;--bg:#0d0a13;--panel:rgba(27,21,37,.82);--text:#f8f3fc;--muted:#bdb0ca;--line:#3c2b4b;--purple:#c79aff;--danger:#ffb8bc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 18% 0%,#33184f 0,transparent 48%),radial-gradient(ellipse at 100% 32%,#221135 0,transparent 48%),var(--bg);font:15px/1.5 system-ui,sans-serif}
header{border-bottom:1px solid var(--line);background:#120d1bd9;backdrop-filter:blur(16px)}.header,main{width:min(1180px,calc(100% - 36px));margin:auto}.header{min-height:72px;display:flex;align-items:center;gap:34px;flex-wrap:wrap;padding:12px 0}
.logo{font-size:17px;font-weight:800;white-space:nowrap}.logo b{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:10px;border-radius:12px;background:linear-gradient(140deg,#873bea,#581f9a);box-shadow:inset 0 1px #ffffff4a;color:white}
nav,.actions,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}a,button,input{font:inherit}nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:9px}nav a[aria-current]{color:white;background:#4a2869}
main{padding:38px 0 60px}h1,h2,p{margin:0}h1{font-size:clamp(31px,5vw,50px);line-height:1.1;letter-spacing:-.04em}h2{font-size:18px}.lead,.muted,small{color:var(--muted)}.lead{margin-top:9px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.glass{border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,#33224666,transparent 58%),var(--panel);box-shadow:inset 0 1px #ffffff0a,0 16px 36px #07050d55;backdrop-filter:blur(16px)}
.metrics,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}.metric,.card,.panel{padding:20px}.metric strong,.count{display:block;font-size:32px;color:#e3c7ff;font-weight:770;line-height:1.2;margin-top:6px}.section-title{margin:26px 0 12px}.card small{display:block;margin-top:7px}.warning{color:var(--danger);overflow-wrap:anywhere}
button,.button{padding:8px 13px;border:1px solid #60427c;border-radius:10px;color:#f7efff;background:#2e1d41;cursor:pointer;text-decoration:none;transition:background .18s,transform .18s}button:hover,.button:hover{background:#4a2a68}button:active{transform:translateY(1px)}button:disabled{opacity:.55;cursor:default}.primary{background:linear-gradient(120deg,#7432bb,#6230a6);border-color:#a46dda}.primary:hover{background:#783abf}.danger{color:var(--danger)}:focus-visible{outline:2px solid #d4a9ff;outline-offset:3px}
.filters{margin-top:12px}.filter{padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#231731;cursor:pointer}input[type=checkbox]{accent-color:#a961ee;width:17px;height:17px;vertical-align:middle;margin:0 5px 0 0}.table-wrap{overflow:auto;margin-top:14px}table{text-align:left;border-collapse:collapse;width:100%;min-width:640px}th,td{padding:11px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}tr[data-selected]{background:#73429b32}.right{margin-left:auto}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.settings{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr);gap:16px;align-items:start}.shop-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}form{display:grid;gap:11px;margin-top:12px}form label:not(.filter){display:grid;gap:4px}input:not([type=checkbox]){width:100%;padding:9px 11px;color:var(--text);background:#181020;border:1px solid #513b66;border-radius:9px}.message{margin-bottom:14px;color:var(--danger)}.empty{padding:16px 0;color:var(--muted)}[hidden]{display:none!important}
.sort{background:transparent;border:0;padding:4px 1px;color:inherit;text-align:left;white-space:nowrap}.sort:hover{color:white;background:transparent}th[aria-sort=ascending] .sort::after{content:' ↑';color:var(--purple)}th[aria-sort=descending] .sort::after{content:' ↓';color:var(--purple)}.thumb{display:grid;place-items:center;width:47px;height:57px;background:#2b1b3b;border:1px solid #4b345c;border-radius:8px;color:var(--muted);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.has-tip{border-bottom:1px dotted var(--purple);cursor:help;white-space:nowrap}.mono{font-variant-numeric:tabular-nums}.diagnostic-hero{margin-bottom:16px;padding:22px;background:linear-gradient(120deg,#482472c9,#181024bf);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}.diagnostic-hero strong{font-size:23px}.pill{padding:5px 9px;border:1px solid #7556a0;border-radius:100px;background:#3c2458;color:#f0dfff}.pill.ok{background:#173c31;border-color:#38856a;color:#baf9d6}.diag-details{margin-top:14px}.diag-details dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin:14px 0 0}.diag-details dt{color:var(--muted)}.diag-details dd{margin:2px 0 0;overflow-wrap:anywhere}.supply-list{word-break:break-word;margin-top:9px}.supply-state{margin-top:10px}.card h2{overflow-wrap:anywhere}
@media(max-width:680px){.header{gap:8px}.settings{grid-template-columns:1fr}main{padding-top:26px}.metric,.card,.panel{padding:15px}}
.order-tooltip{position:fixed;z-index:10;display:grid;gap:3px;width:max-content;max-width:min(250px,calc(100vw - 16px));padding:10px 13px;border:1px solid #7852a1;border-radius:12px;background:linear-gradient(145deg,#3c2454fa,#1e152cf7);box-shadow:inset 0 1px #ffffff18,0 8px 30px #08050dc4;backdrop-filter:blur(12px);pointer-events:none}.order-tooltip strong{font-size:14px}.order-tooltip small{color:#d9bbf5}.tooltip-label{color:#e8cdfc;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.has-tip:focus-visible{border-radius:3px}
@media(prefers-reduced-motion:no-preference){.order-tooltip:not([hidden]){animation:tip-enter .14s ease-out}@keyframes tip-enter{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
<style>
  body { isolation: isolate; }
  #glass-stage { position:fixed; inset:0; z-index:-1; pointer-events:none; isolation:isolate; }
  #ambient-ink { position:absolute; inset:0; width:100%; height:100%; }
  .glass-proxy { position:absolute; left:-999px; width:1px; height:1px; isolation:isolate; }
  @media (min-width: 1440px) {
    .header, main { width: min(1600px, calc(100% - clamp(96px, 12vw, 340px))); }
    .metrics, .cards { gap: 18px; }
    .table-wrap th, .table-wrap td { padding-inline: 15px; }
  }
  @media (forced-colors: active) { #ambient-ink { display: none; } }
</style>
<style>
  :root {
    --glass-fill: linear-gradient(155deg,#f0dbff1c 0%,#a76de81b 30%,#7b53a20d 67%,#9876bd0a 100%);
    --glass-edge: transparent;
  }
  header,.glass,.order-tooltip {
    background: var(--glass-fill);
    border-color: var(--glass-edge);
    box-shadow: none;
    backdrop-filter: blur(22px) saturate(155%);
  }
  header { background-color:#6c4c8b12; }
  .glass {
    position:relative;
    isolation:isolate;
    border:1px solid #dfc4f432;
    border-radius:40px;
    background:linear-gradient(175deg,#e0c0ff18,transparent 66%,#2113330e);
    backdrop-filter:none;
  }
  .shader-backed {
    background:linear-gradient(175deg,#e0c0ff0b,transparent 52%,#21133318);
    box-shadow:none;
    backdrop-filter:none;
  }
  .glass.shader-backed,.table-wrap.shader-backed { border-radius:40px; }
  .shop-row { background-color:#68458b21; }
  .shop-row { margin-top:10px; padding:12px; border:1px solid transparent; border-radius:13px; }
  nav a,.logo b,button,.button,.filter,input:not([type=checkbox]),.pill,.thumb {
    background: linear-gradient(165deg,#f0daff35,#b36bec1c 40%,#975dc62a 72%,#e5b9ff16), #7d58a12a;
    border:1px solid transparent;
    box-shadow:none;
    backdrop-filter: blur(13px) saturate(142%);
  }
  nav a,.logo b,button,.button,.filter,.pill { border-radius:999px; }
  nav a { color:#f2e8fc; }
  nav a[aria-current],.primary,.logo b {
    background: linear-gradient(154deg,#ede0ff66,#bd83ff55 34%,#6824ae9e 74%,#db9aff2f), #482975a0;
    border-color:transparent;
  }

<script>

function element(tag, value, className) {

}

  button.addEventListener('click', callback);

}

}

}

  const loaded = shops.filter(shop => shop.updatedAt);
  const total = loaded.reduce((count, shop) => count + shop.orders.length, 0);

  }));

    const card = element('article', null, 'glass card');

    const link = element('a', 'Добавить магазин', 'button');

    cards.push(empty);

}
function visibleOrders() {
  return shops.filter(shop => filter === null || filter.includes(shop.id))
    .flatMap(shop => (shop.orders || []).map(order => ({
      ...order, shop: shop.name, key: shop.id + '/' + order.id,
    })))
    .sort((a, b) => {
      const left = sortValue(a);
      const right = sortValue(b);
      if (left == null || right == null) return Number(left == null) - Number(right == null);
      const order = typeof left === 'number' && typeof right === 'number' ? left - right : compare.compare(left, right);

function price(order) {
  const original = Number.isFinite(order.price) ? order.price / 100 : null;

  const originalCurrency = Number(order.currencyCode);
  const convertedCurrency = Number(order.convertedCurrencyCode);
  const rub = originalCurrency === 643 && original != null ? original : convertedCurrency === 643 ? converted : null;
  const cny = originalCurrency === 156 && original != null ? original : convertedCurrency === 156 ? converted : null;
  const rate = exchange?.rubPerCny;
  return { rub: rub ?? (cny != null && rate ? cny * rate : null),
    cny: cny ?? (rub != null && rate ? rub / rate : null), approximateRub: rub == null && cny != null && rate,
    approximateCny: cny == null && rub != null && rate };
}
function sortValue(order) {

  if (sort.key === 'price') return price(order).rub;
  if (sort.key === 'age') return Number.isFinite(Date.parse(order.createdAt)) ? -Date.parse(order.createdAt) : null;

}

  if (minutes < 60) return minutes + ' мин';
  if (minutes < 1440) return Math.floor(minutes / 60) + ' ч ' + (minutes % 60) + ' мин';
  return Math.floor(minutes / 1440) + ' д ' + (Math.floor(minutes / 60) % 24) + ' ч';

const tooltip = byId('order-tooltip');
let tooltipAnchor;
function hideTip(anchor = tooltipAnchor) {
