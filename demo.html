<style>
  :root {
    color-scheme:dark;
    --bg:#11101a;
    --panel:#201b2b;
    --raised:#2b2338;
    --glass-surface:linear-gradient(145deg,#c3a8e822,transparent 72%),#21182dc2;
    --glass-control:linear-gradient(150deg,#c6afe72e,transparent 68%),#291d36b8;
    --glass-edge:#bba0d363;
    --text:#f6f2fa;
    --muted:#c1b5cd;
    --line:#453851;
    --purple:#ddbcff;
    --danger:#ffb8bc;
    --motion-fast:180ms;
    --motion-ease:cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing:border-box; }
  html { scrollbar-gutter:stable; }
  body {
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:linear-gradient(160deg,#21152e 0,#11101a 360px) no-repeat,var(--bg);
    font:15px/1.45 system-ui,sans-serif;
  }
  a,button,input { font:inherit; }
  h1,h2,p { margin:0; }
  h1 { font-size:clamp(30px,4vw,48px); line-height:1.08; letter-spacing:-.035em; }
  h2 { font-size:17px; }
  small,.muted,.lead { color:var(--muted); }
  [hidden] { display:none!important; }
  :focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  header { background:linear-gradient(160deg,#ad8bcb16,transparent 68%),#1a1423c9; border-bottom:1px solid var(--glass-edge); }
  .header,main { width:min(1560px,calc(100% - 48px)); margin-inline:auto; }
  .skip-link { position:absolute; z-index:20; top:8px; left:8px; padding:8px 12px; background:var(--text); color:var(--bg); }
  .skip-link:not(:focus) { clip-path:inset(50%); }
  .header,.logo,nav,.actions,.filters,.toolbar,.heading { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .header { min-height:58px; gap:22px; padding-block:8px; }
  .logo { font-size:16px; font-weight:800; white-space:nowrap; }
  .brand-icon { width:28px; height:28px; flex:none; }
  main { padding-block:28px 42px; }
  .heading { justify-content:space-between; align-items:flex-end; margin-bottom:20px; gap:12px; }
  .lead { margin-top:5px; }
  nav a,button,.button,.filter {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:34px;
    padding:5px 11px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--glass-control);
    color:var(--text);
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
  }
  nav a,button:not(.sort):not(.has-tip),.button,.filter {
    border-color:var(--glass-edge);
    box-shadow:inset 0 1px #f7e8ff20;
  }
  nav a { color:var(--muted); }
  nav a[aria-current],.primary { color:var(--text); background:linear-gradient(145deg,#c59bec39,transparent 75%),#462c5dca; border-color:#ab89c7; }
  @media (hover:hover) {
    nav a:hover,button:not(:disabled):not(.has-tip):hover,.button:hover,.filter:hover { background:#3d2e4d; }
    tbody tr:not([data-selected]):hover { background:#292033; }
  }
  @media (prefers-reduced-motion:no-preference) {
    nav a,button:not(.has-tip),.button { transition:transform var(--motion-fast) var(--motion-ease); }
    nav a:active,button:not(.sort):not(.has-tip):enabled:active,.button:active { transform:scale(.97); }
  }
  button:disabled { opacity:.55; cursor:default; }
  .danger,.warning,.message { color:var(--danger); }
  .warning,.card h2,.supply-list { overflow-wrap:anywhere; }
  .message { margin-bottom:10px; }
  .panel,.card,.metric,.diagnostic-hero,.table-wrap {
    border:1px solid var(--glass-edge);
    border-radius:16px;
    background:var(--glass-surface);
    box-shadow:inset 0 1px #f7e8ff16;
  }
  .metrics,.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:10px; }
  .metric,.card,.panel,.diagnostic-hero { padding:14px; }
  .metric { display:flex; flex-direction:column; justify-content:space-between; }
  .metric strong,.count { display:block; margin-top:4px; color:var(--purple); font-size:28px; line-height:1.15; font-weight:750; }
  .section-title { margin:18px 0 8px; }
  .card small { display:block; margin-top:4px; }
  .filters { margin-top:7px; }
  .toolbar { margin-top:10px; }
  .right { margin-left:auto; }
  #selection-status { font-variant-numeric:tabular-nums; }
  .check-target { display:inline-grid; place-items:center; vertical-align:middle; cursor:pointer; }
  .empty { padding:12px 0; color:var(--muted); }
  input[type=checkbox] {
    appearance:none;
    display:inline-grid;
    place-content:center;
    width:18px;
    height:18px;
    margin:0;
    vertical-align:middle;
    background:#20172b;
    border:1px solid #a080bc;
    border-radius:50%;
    cursor:pointer;
  }
  input[type=checkbox]:checked,input[type=checkbox]:indeterminate {
    background:#9f74cb;
    border-color:var(--purple);
  }
  input[type=checkbox]:checked::after {
    content:'';
    width:4px;
    height:7px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:translateY(-1px) rotate(45deg);
  }
  input[type=checkbox]:indeterminate::after { content:''; width:7px; border-top:2px solid white; }
  .table-wrap { margin-top:10px; overflow:auto; scrollbar-color:#9775b3 #241b30; }
  table { width:100%; min-width:785px; table-layout:fixed; border-collapse:collapse; text-align:left; }
  thead { background:#282034a6; }
  th,td { padding:8px 10px; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  th { color:var(--muted); font-size:13px; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr[data-selected] { background:#352444; }
  th:nth-child(1) { width:48px; }
  #assembly th:first-child,#orders td:first-child { text-align:center; vertical-align:middle; }
  th:nth-child(2) { width:98px; }
  th:nth-child(3) { width:92px; }
  th:nth-child(5),th:nth-child(6) { width:108px; }
  th:nth-child(7) { width:78px; }
  th:nth-child(8) { width:16%; }
  .sort {
    position:relative;
    isolation:isolate;
    min-height:30px;
    padding:3px 15px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--text);
    white-space:nowrap;
  }
  .sort::before {
    content:'';
    position:absolute;
    z-index:-1;
    inset:2px 0;
    border:1px solid #d7b9f34a;
    border-radius:inherit;
    background:linear-gradient(155deg,#c5a4e22b,#20172b59);
    pointer-events:none;
  }
  th[aria-sort] .sort::before {
    border-color:#dab9f6ad;
    background:linear-gradient(155deg,#a473ca65,#3b265a98);
  }
  @media (hover:hover) {
    th .sort:enabled:hover { background:transparent; }
    .sort:hover::before { border-color:#dab9f6ad; }
  }
  .sort::after {
    content:'↑';
    position:absolute;
    inset-inline-end:4px;
    top:50%;
    transform:translateY(-50%);
    visibility:hidden;
    color:var(--purple);
  }
  th[aria-sort] .sort::after { visibility:visible; }
  th[aria-sort=descending] .sort::after { content:'↓'; }
  .thumb { display:grid; place-items:center; width:42px; height:48px; overflow:hidden; border:1px solid var(--line); border-radius:7px; color:var(--muted); background:#2e233a; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  button.has-tip {
    display:inline;
    min-height:24px;
    padding:2px 0;
    border:0;
    border-bottom:1px dotted #ae87d0;
    border-radius:0;
    background:none;
    color:inherit;
    font:inherit;
    white-space:nowrap;
  }
  .mono { font-variant-numeric:tabular-nums; }
  .order-tooltip {
    position:fixed;
    z-index:10;
    display:grid;
    gap:3px;
    width:max-content;
    max-width:min(280px,calc(100vw - 16px));
    padding:9px 11px;
    border:1px solid #87669e;
    border-radius:10px;
    background:#24192e;
    pointer-events:none;
  }
  .order-tooltip strong { font-size:14px; }
  .tooltip-label { color:var(--purple); font-size:11px; font-weight:700; }
  .settings { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-items:start; }
  .shop-row,.diagnostic-hero { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .shop-row { padding:9px 0; border-bottom:1px solid var(--line); }
  form { display:grid; gap:9px; margin-top:10px; }
  form label:not(.filter) { display:grid; gap:4px; }
  input:not([type=checkbox]) { width:100%; padding:7px 9px; color:var(--text); background:#18131f; border:1px solid var(--line); border-radius:8px; }
  .diagnostic-hero { margin-bottom:12px; }
  .diagnostic-hero strong { font-size:20px; }
  .pill { display:inline-block; padding:4px 8px; border:1px solid var(--line); border-radius:14px; background:var(--raised); }
  .pill.ok { color:#baf9d6; background:#173c31; border-color:#38856a; }
  .diag-details dl { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:10px; margin:10px 0 0; }
  .diag-details dt { color:var(--muted); }
  .diag-details dd { margin:2px 0 0; overflow-wrap:anywhere; }
  .supply-list,.supply-state { margin-top:8px; }
  #ambient-ink { display:none; }
  @media (max-width:820px) {
    html { scrollbar-gutter:auto; }
    body {
      isolation:isolate;
      font-size:16px;
      --glass-surface:linear-gradient(148deg,#2c203d80,#19122342 78%);
    }
    #dashboard .metric,#dashboard .card {
      background:linear-gradient(155deg,#24192f69,#1a14233b 78%);
    }
    #dashboard .metric,#dashboard .card,#orders tr { text-shadow:0 1px 3px #100b18; }
    #ambient-ink:not([data-renderer="webgl"]) {
      mask-image:linear-gradient(90deg,transparent,black 13%,black 87%,transparent),
        linear-gradient(180deg,transparent,black 16%,black 84%,transparent);
      mask-composite:intersect;
    }
    #ambient-ink {
      display:block;
      position:fixed;
      inset:0;
      z-index:-1;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    .header,main { width:calc(100% - 20px); }
    .header { min-height:46px; gap:4px 10px; padding-block:5px; }
    .logo { font-size:14px; gap:5px; }
    .brand-icon { width:24px; height:24px; }
    nav { gap:4px; }
    nav a,button,.button,.filter { min-height:44px; padding-inline:9px; font-size:14px; }
    input:not([type=checkbox]) { font-size:16px; }
    #selection-status { flex-basis:100%; margin:0; font-size:13px; }
    main { padding-block:14px 24px; }
    h1 { font-size:26px; }
    .heading { gap:7px; margin-bottom:10px; }
    .lead { font-size:13px; }
    .metric,.card,.panel { padding:10px; }
    .metrics { grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr)); gap:6px; }
    .metric strong { font-size:23px; }
    .toolbar { gap:5px; margin-top:7px; }
    .filters { margin-top:5px; }
    .settings { grid-template-columns:1fr; }
    .table-wrap { overflow:visible; margin-top:6px; border:0; background:none; box-shadow:none; }
    table,thead,tbody { display:block; min-width:0; }
    thead { background:none; }
    thead tr { display:flex; flex-wrap:wrap; align-items:center; column-gap:4px; padding:2px 7px; }
    .check-target { width:44px; height:44px; }
    thead th:nth-child(n) { width:auto; padding:0; border:0; }
    thead th:nth-child(3) { display:none; }
    .sort { min-width:44px; min-height:44px; font-size:12px; padding-inline:13px; }
    .sort::before { inset-block:6px; }
    #orders tr {
      display:grid;
      grid-template-columns:44px 32px minmax(0,1fr) minmax(0,auto);
      grid-template-rows:repeat(3,auto);
      gap:3px 7px;
      align-items:center;
      margin-top:5px;
      padding:6px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--glass-surface);
    }
    #orders tr[data-selected] { border-color:#aa82c9; background:linear-gradient(145deg,#5e387b9e,#2a193b80); }
    #orders td { padding:0; border:0; line-height:1.24; }
    #orders td:nth-child(1),#orders td:nth-child(3) {
      grid-row:1 / -1;
      align-self:center;
      justify-self:center;
      display:grid;
      place-items:center;
    }
    #orders td:nth-child(1) { grid-column:1; }
    #orders td:nth-child(2) { grid-area:2 / 3; color:var(--muted); font-size:12px; }
    #orders td:nth-child(3) { grid-column:2; }
    #orders td:nth-child(4) { grid-area:1 / 3; font-size:14px; }
    #orders td:nth-child(4) .muted { font-size:11px; }
    #orders td:nth-child(5),#orders td:nth-child(6),#orders td:nth-child(8) {
      justify-self:end;
      text-align:right;
    }
    #orders td:nth-child(5) { grid-area:1 / 4; }
    #orders td:nth-child(6) { grid-area:2 / 4; }
    #orders td:nth-child(7) { grid-area:3 / 3; }
    #orders td:nth-child(7)::before { content:'Склад '; }
    #orders td:nth-child(8) { grid-area:3 / 4; max-width:86px; }
    #orders td:nth-child(n+6) { font-size:12px; color:var(--muted); }
    #orders .thumb { width:32px; height:37px; }
  }
  @media (forced-colors:active) {
    input[type=checkbox] { appearance:auto; }
    #ambient-ink { display:none; }
  }
</style>
</head>
<body>
<canvas id="ambient-ink" aria-hidden="true"></canvas>
<a class="skip-link" href="#main-content">К содержимому</a>
<header><div class="header"><div class="logo"><img class="brand-icon" alt="" width="32" height="32">Собирашкин</div><nav aria-label="Разделы"><a href="?view=summary">Сводка</a><a href="?view=assembly">Сборка</a></nav></div></header>
<main id="main-content" tabindex="-1">
  <div class="heading">
    <div><h1 id="heading"></h1><p class="lead" id="lead"></p></div>
    <button id="refresh" class="primary" type="button">Обновить заказы</button>
  </div>
  <p id="message" class="message" role="status" hidden></p>
  <section id="dashboard" hidden>
    <div class="metrics" id="metrics"></div>
    <h2 class="section-title">Заказы по магазинам</h2>
    <div class="cards" id="cards"></div>
  </section>
  <section id="assembly" class="glass panel" hidden>
    <h2>Магазины</h2>
    <div class="filters" id="filters"></div>
    <div class="toolbar"><button id="select-visible" type="button">Выбрать видимые</button><button id="clear-selection" type="button">Снять выбор</button><span id="selection-status" class="muted right" aria-live="polite"></span></div>
    <p id="assembly-note" class="empty" hidden></p>
    <div class="table-wrap" id="table-wrap">
      <table aria-label="Заказы для сборки">
        <thead role="rowgroup"><tr role="row"><th role="columnheader"><label class="check-target"><input id="select-all" type="checkbox" aria-label="Выбрать все видимые заказы"></label></th><th role="columnheader"><button class="sort" data-sort="id">Номер</button></th><th role="columnheader">Карточка</th><th role="columnheader"><button class="sort" data-sort="title">Название</button></th><th role="columnheader"><button class="sort" data-sort="price">Цена</button></th><th role="columnheader"><button class="sort" data-sort="age">Таймер</button></th><th role="columnheader"><button class="sort" data-sort="warehouseId">Склад</button></th><th role="columnheader"><button class="sort" data-sort="shop">Магазин</button></th></tr></thead>
        <tbody id="orders" role="rowgroup"></tbody>
      </table>
    </div>
  </section>
  <section id="supplies" hidden>
    <div class="glass panel"><div class="actions"><a class="button" href="/assembly">К заказам</a><button id="preview-supplies" class="primary" type="button">Рассчитать поставки</button><button type="button" disabled>Отправить в сборку</button></div><p class="supply-state muted" id="supply-status" role="status"></p></div>
    <h2 class="section-title">Поставки по магазинам</h2><div class="cards" id="supply-items"></div>
  </section>
  <section id="vds" hidden>
    <div class="glass diagnostic-hero"><div><strong id="vds-location">Проверка подключения</strong><p class="muted" id="vds-endpoint"></p></div><span class="pill" id="vds-badge">Ожидание</span></div>
    <div class="metrics" id="vds-metrics"></div>
    <div class="glass panel diag-details"><h2>Маршрут и геолокация</h2><dl id="vds-details"></dl></div>
  </section>
  <section id="shops" class="settings" hidden>
    <div class="glass panel"><h2>Подключённые магазины</h2><div id="shop-list"></div></div>
    <div class="glass panel">
      <h2 id="form-title">Добавить магазин</h2>
      <form id="shop-form" autocomplete="off">
        <label>Название магазина<input id="shop-name" maxlength="80" required></label>
        <label>API-токен «Маркетплейс»<input id="shop-token" type="password" maxlength="4096" spellcheck="false" autocomplete="off" required></label>
        <label>Отдельный токен «Контент» (если нужен)<input id="content-token" type="password" maxlength="4096" spellcheck="false" autocomplete="off"></label>
        <small>Если основной токен уже даёт доступ к категории «Контент», оставь второе поле пустым.</small>
        <label id="clear-content-row" class="filter" hidden><input id="clear-content" type="checkbox">Удалить отдельный токен «Контент»</label>
        <div class="actions"><button type="submit" id="save" class="primary">Сохранить магазин</button><button id="cancel" type="button" hidden>Отмена</button></div>
      </form>
    </div>
  </section>
</main>
<div id="order-tooltip" class="order-tooltip" aria-hidden="true" hidden></div>
<script>
document.querySelector('.brand-icon').src = document.querySelector('link[rel="icon"]').href;
const byId = id => document.getElementById(id);
const sections = {
  '/': ['dashboard', 'Сводка заказов', 'Новые сборочные задания FBS по магазинам.'],
  '/assembly': ['assembly', 'Сборка', 'Выбери магазины и отметь заказы, которые берёшь в работу.'],
  '/shops': ['shops', 'Магазины', 'Подключи магазины по API-токенам Wildberries.'],
  '/supplies': ['supplies', 'Поставки', 'Предпросмотр отправки выбранных заказов в сборку WB.'],
  '/vds': ['vds', 'Диагностика VDS', 'SSH, исходящий IPv4 и доступность WB API с сервера.'],
};
const view = new URLSearchParams(location.search).get('view') === 'summary' ? 'summary' : 'assembly';
const [section, heading, lead] = sections[view === 'summary' ? '/' : '/assembly'];
byId(section).hidden = false;
byId('heading').textContent = heading;
byId('lead').textContent = 'Демо-магазин · ' + lead;
document.querySelector('nav a[href="?view=' + view + '"]').setAttribute('aria-current', 'page');
const dateFormat = new Intl.DateTimeFormat('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
const number = new Intl.NumberFormat('ru-RU');
let shops = [];
let picked = new Set();
let filter = null;
let editing = '';
let sending = false;
let syncing = false;
let systemError = '';
let exchange = null;
let assemblySnapshot;
let sort = { key: 'age', direction: -1 };
let diagnosticBusy = false;
let previewBusy = false;
const compare = new Intl.Collator('ru-RU', { numeric: true, sensitivity: 'base' });
const rubles = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', trailingZeroDisplay: 'stripIfInteger' });
const yuan = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'CNY', trailingZeroDisplay: 'stripIfInteger' });
const ageFormat = new Intl.DateTimeFormat('ru-RU', { dateStyle: 'medium', timeStyle: 'medium', timeZone: 'Europe/Moscow' });
try {
  picked = new Set(JSON.parse(sessionStorage.getItem('sobirashkin-demo-picked') || '[]'));
  filter = JSON.parse(sessionStorage.getItem('sobirashkin-demo-filter') || 'null');
  sort = JSON.parse(sessionStorage.getItem('sobirashkin-demo-sort') || 'null') || sort;
} catch {}

function element(tag, value, className) {
  const item = document.createElement(tag);
  if (value != null) item.textContent = value;
  if (className) item.className = className;
  return item;
}
function action(label, callback, className) {
  const button = element('button', label, className);
  button.type = 'button';
  button.addEventListener('click', callback);
  return button;
}
function date(value) {
  const parsed = new Date(value);
  return value && !Number.isNaN(parsed.getTime()) ? dateFormat.format(parsed) : '—';
}
function showError(message = '') {
  const status = byId('message');
  status.textContent = message;
  status.hidden = !message;
}
function store(key, value) {
  try { sessionStorage.setItem(key, JSON.stringify(value)); } catch {}
}
function shopStatus(shop) {
  if (shop.error) return shop.error;
  if (shop.loadingTitles) return 'Заказы получены. Загружаются названия…';
  if (shop.busy) return 'Обновляется…';
  return shop.updatedAt ? 'Обновлено ' + date(shop.updatedAt) : 'Ещё не обновлялся';
}
function renderDashboard() {
  const loaded = shops.filter(shop => shop.updatedAt);
  const total = loaded.reduce((count, shop) => count + shop.orders.length, 0);
  const metrics = [['Новые задания', loaded.length ? number.format(total) : '—'],
    ['Данные получены', loaded.length + ' из ' + shops.length],
    ['Магазины с ошибками', shops.filter(shop => shop.error).length]];
  byId('metrics').replaceChildren(...metrics.map(([label, value]) => {
    const card = element('div', null, 'glass metric');
    card.append(element('span', label, 'muted'), element('strong', value));
    return card;
  }));
  const cards = shops.map(shop => {
    const card = element('article', null, 'glass card');
    card.append(element('h2', shop.name), element('div', shop.orders ? number.format(shop.orders.length) : '—', 'count'),
      element('span', 'Новые задания', 'muted'), element('small', shopStatus(shop), shop.error ? 'warning' : ''));
    if (shop.titleError) card.append(element('small', shop.titleError, 'warning'));
    return card;
  });
  if (!cards.length) {
    const empty = element('div', null, 'glass card');
    empty.append(element('p', 'Подключи магазин, чтобы увидеть заказы.', 'empty'));
    const link = element('a', 'Добавить магазин', 'button');
    link.href = '/shops';
    empty.append(link);
    cards.push(empty);
  }
  byId('cards').replaceChildren(...cards);
}
function visibleOrders() {
  return shops.filter(shop => filter === null || filter.includes(shop.id))
    .flatMap(shop => (shop.orders || []).map(order => ({
      ...order, shop: shop.name, key: shop.id + '/' + order.id,
    })))
    .sort((a, b) => {
      const left = sortValue(a);
      const right = sortValue(b);
      if (left == null || right == null) return Number(left == null) - Number(right == null);
      const order = typeof left === 'number' && typeof right === 'number' ? left - right : compare.compare(left, right);
      return order * sort.direction || compare.compare(a.key, b.key);
    });
}
function price(order) {
  const original = Number.isFinite(order.price) ? order.price / 100 : null;
  const converted = Number.isFinite(order.convertedPrice) ? order.convertedPrice / 100 : null;
  const originalCurrency = Number(order.currencyCode);
  const convertedCurrency = Number(order.convertedCurrencyCode);
  const rub = originalCurrency === 643 && original != null ? original : convertedCurrency === 643 ? converted : null;
  const cny = originalCurrency === 156 && original != null ? original : convertedCurrency === 156 ? converted : null;
  const rate = exchange?.rubPerCny;
  return { rub: rub ?? (cny != null && rate ? cny * rate : null),
    cny: cny ?? (rub != null && rate ? rub / rate : null), approximateRub: rub == null && cny != null && rate,
    approximateCny: cny == null && rub != null && rate };
}
function sortValue(order) {
  if (sort.key === 'title') return order.title || order.article || null;
  if (sort.key === 'price') return price(order).rub;
  if (sort.key === 'age') return Number.isFinite(Date.parse(order.createdAt)) ? -Date.parse(order.createdAt) : null;
  return order[sort.key] ?? null;
}
function age(value) {
  if (!Number.isFinite(Date.parse(value))) return '—';
  const minutes = Math.max(0, Math.floor((Date.now() - Date.parse(value)) / 60000));
  if (minutes < 1) return '< 1 мин';
  if (minutes < 60) return minutes + ' мин';
  if (minutes < 1440) return Math.floor(minutes / 60) + ' ч ' + (minutes % 60) + ' мин';
  return Math.floor(minutes / 1440) + ' д ' + (Math.floor(minutes / 60) % 24) + ' ч';
}
const tooltip = byId('order-tooltip');
let tooltipAnchor;
function hideTip(anchor = tooltipAnchor) {
  if (tooltipAnchor !== anchor) return;
  tooltip.hidden = true;
  tooltipAnchor = null;
}
function tip(value, label, detail, note = '') {
  const span = element('button', value, 'has-tip mono');
  span.type = 'button';
  span.setAttribute('aria-description', [label, detail, note].filter(Boolean).join('. '));
  const show = () => {
    tooltipAnchor = span;
    tooltip.replaceChildren(element('span', label, 'tooltip-label'), element('strong', detail));
    if (note) tooltip.append(element('small', note));
    tooltip.hidden = false;
    const target = span.getBoundingClientRect();
    const box = tooltip.getBoundingClientRect();
    const left = Math.max(8, Math.min(target.left, document.documentElement.clientWidth - box.width - 8));
    const top = target.bottom + box.height + 16 <= document.documentElement.clientHeight
      ? target.bottom + 8 : Math.max(8, target.top - box.height - 8);
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  };
  span.addEventListener('pointerenter', event => { if (event.pointerType !== 'touch') show(); });
  span.addEventListener('click', show);
  span.addEventListener('pointerleave', () => { if (document.activeElement !== span) hideTip(span); });
  span.addEventListener('focus', show);
  span.addEventListener('blur', () => hideTip(span));
  return span;
}
document.addEventListener('keydown', event => { if (event.key === 'Escape') hideTip(); });
document.addEventListener('pointerdown', event => { if (event.target !== tooltipAnchor) hideTip(); });
window.addEventListener('scroll', () => hideTip(), { capture: true, passive: true });
window.addEventListener('resize', () => hideTip());
function updateSelection(visible) {
  const selected = visible.filter(order => picked.has(order.key)).length;
  const toggle = byId('select-all');
  toggle.checked = visible.length > 0 && selected === visible.length;
  toggle.indeterminate = selected > 0 && selected < visible.length;
  toggle.disabled = !visible.length;
  byId('select-visible').disabled = !visible.length;
  byId('clear-selection').disabled = !picked.size;
  byId('selection-status').textContent = 'Выбрано ' + picked.size + ' · видно ' + selected + ' из ' + visible.length;
  store('sobirashkin-demo-picked', [...picked]);
}
function setVisibleSelection(add) {
  for (const { key } of visibleOrders()) add ? picked.add(key) : picked.delete(key);
  renderAssembly();
}
function renderAssembly() {
  hideTip();
  for (const header of document.querySelectorAll('[data-sort]')) {
    if (header.dataset.sort === sort.key) header.parentElement.setAttribute('aria-sort', sort.direction === 1 ? 'ascending' : 'descending');
    else header.parentElement.removeAttribute('aria-sort');
  }
  const previousFilter = document.activeElement?.dataset.shopFilter;
  const filters = shops.map(shop => {
    const label = element('label', null, 'filter');
    const checkbox = element('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.shopFilter = shop.id;
    checkbox.checked = filter === null || filter.includes(shop.id);
    checkbox.addEventListener('change', () => {
      const ids = new Set(filter === null ? shops.map(item => item.id) : filter);
      checkbox.checked ? ids.add(shop.id) : ids.delete(shop.id);
      filter = ids.size === shops.length ? null : [...ids];
      store('sobirashkin-demo-filter', filter);
      renderAssembly();
    });
    label.append(checkbox, document.createTextNode(shop.name));
    return label;
  });
  byId('filters').replaceChildren(...filters);
  if (previousFilter) byId('filters').querySelector('[data-shop-filter="' + previousFilter + '"]')?.focus();
  const visible = visibleOrders();
  const previousOrder = document.activeElement?.dataset.orderKey;
  const running = shops.some(shop => shop.busy);
  const note = byId('assembly-note');
  note.hidden = Boolean(visible.length);
  note.textContent = !shops.length ? 'Добавь магазин в разделе «Магазины».'
    : running ? 'Заказы обновляются…' : 'Для выбранных магазинов нет отображаемых заданий. Проверь фильтры и статусы на сводке.';
  byId('table-wrap').hidden = !visible.length;
  byId('orders').replaceChildren(...visible.map(order => {
    const row = element('tr');
    row.setAttribute('role', 'row');
    const check = element('input');
    check.type = 'checkbox';
    check.dataset.orderKey = order.key;
    check.checked = picked.has(order.key);
    row.toggleAttribute('data-selected', check.checked);
    check.setAttribute('aria-label', 'Выбрать задание ' + order.id + ', ' + order.shop);
    check.addEventListener('change', () => {
      check.checked ? picked.add(order.key) : picked.delete(order.key);
      row.toggleAttribute('data-selected', check.checked);
      updateSelection(visible);
    });
    const checkTarget = element('label', null, 'check-target');
    checkTarget.append(check);
    row.insertCell().append(checkTarget);
    row.insertCell().textContent = order.id;
    const thumb = element('span', '—', 'thumb');
    if (order.photo) {
      const img = element('img');
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('error', () => thumb.replaceChildren(document.createTextNode('—')), { once: true });
      img.src = order.photo;
      thumb.replaceChildren(img);
    }
    row.insertCell().append(thumb);
    const product = row.insertCell();
    product.append(element('strong', order.title || order.article || 'Товар без названия'));
    if (order.title && order.article) product.append(element('div', order.article, 'muted'));
    const amounts = price(order);
    const cost = amounts.rub == null ? '—' : (amounts.approximateRub ? '≈ ' : '') + rubles.format(amounts.rub);
    const cny = amounts.cny == null ? 'Недоступна' : (amounts.approximateCny ? '≈ ' : '') + yuan.format(amounts.cny);
    const priceNote = amounts.cny == null ? '' : amounts.approximateCny ? 'Курс ЦБ РФ за ' + exchange.date : 'Цена WB';
    row.insertCell().append(tip(cost, 'Цена в юанях', cny, priceNote));
    const created = Date.parse(order.createdAt);
    const timer = tip(age(order.createdAt), 'Время заказа', Number.isFinite(created) ? ageFormat.format(created) : 'Неизвестно', Number.isFinite(created) ? 'Московское время' : '');
    timer.dataset.created = order.createdAt || '';
    row.insertCell().append(timer);
    row.insertCell().textContent = order.warehouseId ?? '—';
    row.insertCell().textContent = order.shop;
    for (const cell of row.cells) cell.setAttribute('role', 'cell');
    return row;
  }));
  if (previousOrder) {
    [...byId('orders').querySelectorAll('input')].find(input => input.dataset.orderKey === previousOrder)?.focus();
  }

    motion.addEventListener('change', schedule);
    forcedColors.addEventListener('change', resize);
    surface.addEventListener('webglcontextlost', () => {
      if (canvas !== surface) return;
      shader = null;
      surface.replaceWith(fallback);
      canvas = fallback;
      resize();
    });
    resize();
  }
})();
</script>
</body>
